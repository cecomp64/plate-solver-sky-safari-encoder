# Copy to config.yaml and fill in your real site location.
# config.yaml is gitignored so your location doesn't end up in git history.

# Observing sites. Needed to convert the plate solver's RA/Dec fix into
# Alt/Az for the SkySafari encoder protocol. There's no GPS in v1, so
# these are fixed points - the button/LED (location_selector below)
# switches which one is active without needing a laptop in the field.
# A wrong value here biases every reported position by roughly the
# amount your real location differs from the selected one.
locations:
  - name: "Location 1"
    latitude_deg: 0.0
    longitude_deg: 0.0
    elevation_m: 0.0
  - name: "Location 2"
    latitude_deg: 0.0
    longitude_deg: 0.0
    elevation_m: 0.0

location_selector:
  # BCM GPIO numbering. Button: one leg to this pin, other leg to GND
  # (gpiozero's Button defaults to an internal pull-up, so no external
  # resistor is needed, and no LED to wire either - see led_name below).
  button_gpio: 17
  # Uses the Pi's built-in power LED as the indicator instead of a
  # separate wired LED - no soldering, one less thing to mount. This is
  # a case-insensitive substring match against /sys/class/leds/* (run
  # `ls /sys/class/leds/` on your Pi to see the exact names available;
  # commonly "PWR" or "led1" for the red power LED). Needs the udev rule
  # from SETUP.md so the service can write to it without running as root.
  # While the service is running, this LED no longer shows normal
  # "power is good" status - it's restored on a clean shutdown.
  led_name: "PWR"
  # Where the active location index is persisted across power cycles.
  # Relative paths are resolved from the working directory binoc-solve.service
  # runs from (see systemd/binoc-solve.service) - kept outside config.yaml
  # itself so editing your location list doesn't reset the selection.
  state_file: "state/active_location.txt"
  bounce_time_s: 0.05
  # Blink timing: each press blinks the LED (1-indexed) location number,
  # this many times, e.g. location 2 with blink_repeats=2 blinks
  # "on-off on-off, pause, on-off on-off, pause".
  blink_on_s: 0.15
  blink_off_s: 0.15
  blink_repeat_pause_s: 0.8
  blink_repeats: 2

simulator_selector:
  # A second button that cycles the solve loop through three data
  # sources (binoc_solve/pipeline_mode.py): the real camera/cedar-detect/
  # cedar-solve pipeline, a smoothly slewing canned position
  # (binoc_solve/fakes.py - no pointing at open sky needed), and the
  # real cedar-detect/cedar-solve pipeline fed pre-rendered test images
  # from synthetic_camera.image_dir below instead of a live capture
  # (binoc_solve/synthetic_camera.py - a genuine solve against known
  # ground truth, still no open sky needed). Wired the same way as
  # location_selector's button (one leg to this pin, other leg to GND),
  # but to a different pin. Always starts on the real pipeline at boot -
  # unlike the location selection, this is not persisted, so a forgotten
  # press can't silently serve fake/synthetic positions after a power
  # cycle in the field.
  button_gpio: 27
  # The Pi's ACT (activity) LED, distinct from location_selector's PWR
  # LED so both indicators are visible at once. Same case-insensitive
  # substring match against /sys/class/leds/* - run `ls /sys/class/leds/`
  # to see what's on your board if "ACT" doesn't match.
  led_name: "ACT"
  bounce_time_s: 0.05
  # Blink timing: 1 blink = real pipeline, 2 blinks = simulator, 3
  # blinks = synthetic, each blink_repeats times over.
  blink_on_s: 0.15
  blink_off_s: 0.15
  blink_repeat_pause_s: 0.8
  blink_repeats: 2

camera:
  # Exposure/gain starting point for a long, unattended night-sky still.
  # Tune this by hand once, based on scripts/solve_once.py's star-count
  # output (too few stars -> raise exposure_ms or gain; blown-out/trailed
  # stars -> lower exposure_ms) - auto_exposure below then nudges these
  # at runtime if real field conditions (moon, haze, light pollution)
  # turn out different from tonight's tuning, so this doesn't have to be
  # exactly right, just a reasonable starting guess.
  exposure_ms: 1200
  gain: 8.0
  width: 2592
  height: 1944

auto_exposure:
  # Closed-loop exposure/gain control: there's no laptop in the field to
  # re-run scripts/solve_once.py if camera.exposure_ms/gain above turn
  # out wrong for the night's actual sky, so this nudges them at runtime
  # using cedar-detect's own centroid count and peak pixel value each
  # cycle instead. Set to false to pin camera.exposure_ms/gain exactly as
  # configured (the old behavior).
  enabled: true
  # IMPORTANT for an untracked mount: keep max_exposure_ms comfortably
  # under the point where stars start trailing into streaks cedar-detect
  # can't centroid - well under 2s on most undriven mounts.
  min_exposure_ms: 200
  max_exposure_ms: 1500
  min_gain: 1.0
  max_gain: 16.0
  # Fewer than this many centroids for low_streak consecutive cycles ->
  # raise exposure (then gain, once exposure is already at max_exposure_ms).
  min_centroids: 15
  low_streak: 3
  # A centroid this bright (0-255) for high_streak consecutive cycles
  # means blown-out/saturated stars -> lower exposure (then gain, once
  # exposure is already at min_exposure_ms).
  saturation_peak: 250
  high_streak: 2
  # Multiplicative step per adjustment (e.g. 1.4 = +/-40% each time).
  adjustment_factor: 1.4
  # Cycles to wait after any adjustment before evaluating again, so one
  # change has time to show up in a fresh capture before another stacks
  # on top of it.
  cooldown_cycles: 2

synthetic_camera:
  # Pre-rendered test images (scripts/generate_test_image.py) that the
  # simulator_selector button's SYNTHETIC mode walks through, one every
  # interval_s, feeding each through the *real* cedar-detect/cedar-solve
  # pipeline - unlike the SIMULATOR mode above, this exercises genuine
  # star detection/solving against known ground truth, without a live
  # camera capture. Relative paths resolve from the working directory
  # binoc-solve.service runs from (see systemd/binoc-solve.service).
  image_dir: "test_images"
  interval_s: 1.5

failed_frames:
  # Saves real-camera frames that failed to solve, so field failures can
  # be diagnosed afterwards (motion blur vs sky glow vs cloud) and
  # replayed offline with scripts/solve_image.py. Rate-limited, and only
  # the newest max_files are kept (dark frames are ~100KB;
  # noisy ones larger) so a bad night can't fill
  # the SD card. Relative paths resolve from the working directory
  # binoc-solve.service runs from (see systemd/binoc-solve.service).
  enabled: true
  dir: "failed_frames"
  min_interval_s: 30.0
  max_files: 50

solver:
  # IMPORTANT: cedar-solve's bundled default_database only covers 10-30deg
  # FOV. This camera's stock lens (OV5647, 3.6mm M12) is ~53.5deg
  # horizontal - well outside that range, so leaving this null will fail
  # to solve real images, not just solve them slower. Build a database
  # matched to this camera with `scripts/build_database.py --max-fov 55`
  # (see SETUP.md) and point this at it before expecting real solves to
  # work. See scripts/generate_test_image.py + scripts/solve_image.py for
  # a way to verify this without a real capture.
  database_path: null
  fov_estimate_deg: 53.5
  sigma: 8.0
  solve_timeout_ms: 1000
  # How far a detected star pattern may differ from the catalog's and
  # still match. cedar-solve's default (0.002) is too tight for the stock
  # lens: its distortion pushes patterns spanning the wide field outside
  # that tolerance, so solves only succeed when the bright anchor stars
  # happen to sit near the center (in practice: near zenith). 0.005
  # recovered those frames with no false solves on random star fields.
  match_max_error: 0.005
  # Frames are captured continuously in the background (frame_grabber.py),
  # so each solve is only given until the next frame is due: a newer frame
  # beats finishing an old one, which after a slew was likely exposed while
  # still moving. This is the minimum it's given regardless, kept above the
  # ~0.3-0.6s that genuine solves on faint frames can need.
  supersede_after_ms: 500

cedar_detect:
  address: "localhost:50051"
  # Downscale factor (2, 4 or 8) cedar-detect uses to find star candidates;
  # centroids are still reported at full resolution. cedar-detect only
  # accepts compact star images, so at 2 this lens's bright stars - which
  # spread over ~10px - were rejected as non-stars, leaving the solver to
  # pattern-match fainter stars and noise. At 4 they're detected and
  # ranked brightest, as the catalog patterns expect: tonight's failed
  # zenith frames went from 0 of 41 solved to 35 of 41.
  binning: 4

encoder:
  # SkySafari connection. Matches the esp32_push_to project's settings so
  # an existing SkySafari scope profile keeps working unchanged.
  bind_host: "0.0.0.0"
  bind_port: 4030
  az_resolution: 36000
  alt_resolution: 36000
  # Flip an axis if it reads backwards in SkySafari once connected -
  # same idea as FLIP_AZIMUTH/FLIP_ALTITUDE in esp32_push_to.
  flip_azimuth: false
  flip_altitude: false

loop:
  # Floor on how often to capture+solve, in seconds. Solving is the
  # bottleneck (typically much slower than this); this just prevents
  # hammering the camera if a solve ever returns unusually fast.
  min_interval_s: 0.5
  # Log a warning if the encoder server is serving a fix older than this
  # (camera occluded, solver failing, etc).
  stale_fix_warn_s: 10.0
