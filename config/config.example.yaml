# Copy to config.yaml and fill in your real site location.
# config.yaml is gitignored so your location doesn't end up in git history.

# Observing sites. Needed to convert the plate solver's RA/Dec fix into
# Alt/Az for the SkySafari encoder protocol. There's no GPS in v1, so
# these are fixed points - the button/LED (location_selector below)
# switches which one is active without needing a laptop in the field.
# A wrong value here biases every reported position by roughly the
# amount your real location differs from the selected one.
locations:
  - name: "Location 1"
    latitude_deg: 0.0
    longitude_deg: 0.0
    elevation_m: 0.0
  - name: "Location 2"
    latitude_deg: 0.0
    longitude_deg: 0.0
    elevation_m: 0.0

location_selector:
  # BCM GPIO numbering. Button: one leg to this pin, other leg to GND
  # (gpiozero's Button defaults to an internal pull-up, so no external
  # resistor is needed, and no LED to wire either - see led_name below).
  button_gpio: 17
  # Uses the Pi's built-in power LED as the indicator instead of a
  # separate wired LED - no soldering, one less thing to mount. This is
  # a case-insensitive substring match against /sys/class/leds/* (run
  # `ls /sys/class/leds/` on your Pi to see the exact names available;
  # commonly "PWR" or "led1" for the red power LED). Needs the udev rule
  # from SETUP.md so the service can write to it without running as root.
  # While the service is running, this LED no longer shows normal
  # "power is good" status - it's restored on a clean shutdown.
  led_name: "PWR"
  # Where the active location index is persisted across power cycles.
  # Relative paths are resolved from the working directory binoc-solve.service
  # runs from (see systemd/binoc-solve.service) - kept outside config.yaml
  # itself so editing your location list doesn't reset the selection.
  state_file: "state/active_location.txt"
  bounce_time_s: 0.05
  # Blink timing: each press blinks the LED (1-indexed) location number,
  # this many times, e.g. location 2 with blink_repeats=2 blinks
  # "on-off on-off, pause, on-off on-off, pause".
  blink_on_s: 0.15
  blink_off_s: 0.15
  blink_repeat_pause_s: 0.8
  blink_repeats: 2

camera:
  # Exposure/gain for a long, unattended night-sky still. Start here and
  # adjust based on scripts/solve_once.py's star-count output: too few
  # stars -> raise exposure_ms or gain; blown-out/trailed stars -> lower
  # exposure_ms.
  exposure_ms: 2000
  gain: 8.0
  width: 2592
  height: 1944

solver:
  # IMPORTANT: cedar-solve's bundled default_database only covers 10-30deg
  # FOV. This camera's stock lens (OV5647, 3.6mm M12) is ~53.5deg
  # horizontal - well outside that range, so leaving this null will fail
  # to solve real images, not just solve them slower. Build a database
  # matched to this camera with `scripts/build_database.py --max-fov 55`
  # (see SETUP.md) and point this at it before expecting real solves to
  # work. See scripts/generate_test_image.py + scripts/solve_image.py for
  # a way to verify this without a real capture.
  database_path: null
  fov_estimate_deg: 53.5
  sigma: 8.0
  solve_timeout_ms: 3000

cedar_detect:
  address: "localhost:50051"

encoder:
  # SkySafari connection. Matches the esp32_push_to project's settings so
  # an existing SkySafari scope profile keeps working unchanged.
  bind_host: "0.0.0.0"
  bind_port: 4030
  az_resolution: 36000
  alt_resolution: 36000
  # Flip an axis if it reads backwards in SkySafari once connected -
  # same idea as FLIP_AZIMUTH/FLIP_ALTITUDE in esp32_push_to.
  flip_azimuth: false
  flip_altitude: false

loop:
  # Floor on how often to capture+solve, in seconds. Solving is the
  # bottleneck (typically much slower than this); this just prevents
  # hammering the camera if a solve ever returns unusually fast.
  min_interval_s: 0.5
  # Log a warning if the encoder server is serving a fix older than this
  # (camera occluded, solver failing, etc).
  stale_fix_warn_s: 10.0
